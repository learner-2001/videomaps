name: render
# mode comes from the branch name, because the fine-grained PAT cannot call the Actions API:
#   render/bench   -> frame-rate benchmark
#   render/preview -> 4 full-quality stills (approval gate)
#   render/full    -> 1808 frames -> mp4
on:
  push:
    branches: ["render/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MODE: ${{ contains(github.ref_name, 'full') && 'full' || contains(github.ref_name, 'preview') && 'preview' || 'bench' }}
      BENCH_N1: "16"
      BENCH_N2: "6"
      WORKERS: "3"
      CHUNK: "252"
      JQ: "93"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright numpy pillow requests shapely imageio-ffmpeg
          python -m playwright install chromium
          nproc; free -g | head -2; df -h . | tail -1

      - name: assets (geoBoundaries + flagcdn + Wikimedia CC photos + fonts + World Bank)
        run: |
          python render/fetch_assets.py
          python render/prep_geo.py
          python render/bake.py

      - name: audio -> timeline (voice drives every cut)
        if: env.MODE != 'bench'
        run: python render/build_audio.py

      - name: bench
        if: env.MODE == 'bench'
        run: |
          TILE=0 python render/bench.py || echo BENCH_NOSAT_FAILED
          cp -f bench.json results_bench_nosat.json 2>/dev/null || true
          TILE=1 python render/bench.py || echo BENCH_SAT_FAILED
          cp -f bench.json results_bench_sat.json 2>/dev/null || true

      - name: preview (4 frames, full quality)
        if: env.MODE == 'preview'
        run: python render/render_all.py --preview 3.5,17.0,30.0,45.5,57.5

      - name: full render
        if: env.MODE == 'full'
        run: python render/render_all.py

      - name: publish to render-out branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          STAGE=/tmp/res
          rm -rf $STAGE && mkdir -p $STAGE && cd $STAGE
          git init -q -b res
          mkdir -p results
          cp -r "$GITHUB_WORKSPACE/results/." results/ 2>/dev/null || true
          { echo "run=${{ github.run_id }} mode=$MODE sha=${{ github.sha }}"; date -u;
            echo "--- files ---"; cd "$GITHUB_WORKSPACE" && ls -la results results/preview 2>/dev/null;
            echo "--- seg reports ---"; cat out/seg_*.json 2>/dev/null | tr -d ' \n'; } > $STAGE/results/META.txt
          du -sh assets out results 2>/dev/null >> $STAGE/results/META.txt || true
          cd $STAGE
          LIST=$(cd "$GITHUB_WORKSPACE" && find results -type f | wc -l)
          BYTES=$(cd "$GITHUB_WORKSPACE" && du -sb results 2>/dev/null | cut -f1)
          git add -A
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com \
            commit -qm "results: $MODE run ${{ github.run_id }} files=$LIST bytes=$BYTES"
          PURL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f -q "$PURL" HEAD:refs/heads/render-out && echo "PUSH_BACK_OK files=$LIST" || echo "PUSH_BACK_BLOCKED"

      - name: artifact fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ env.MODE }}-${{ github.run_number }}
          path: |
            results/
            out/
            bench.json
          if-no-files-found: warn
          retention-days: 3
