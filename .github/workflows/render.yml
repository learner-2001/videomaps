name: render
# mode comes from the branch name, because the fine-grained PAT cannot call the Actions API:
#   render/bench   -> frame-rate benchmark
#   render/preview -> 4 full-quality stills (approval gate)
#   render/full    -> 1808 frames -> mp4
on:
  push:
    branches: ["render/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MODE: ${{ contains(github.ref_name, 'full') && 'full' || contains(github.ref_name, 'preview') && 'preview' || contains(github.ref_name, 'probe') && 'probe' || 'bench' }}
      BENCH_N1: "16"
      BENCH_N2: "6"
      WORKERS: "4"
      CHUNK: "190"
      JQ: "93"
      RELOAD_EVERY: "1000"
      PRESET: "ultrafast"      # 4 x264 instances were stealing the browsers' cores
      CRF: "19"
      RENDER_FPS: "24"         # 1447 frames instead of 1808, identical duration
      SLOW_WARN_MS: "2600"
      PROBE_FRAMES: "48"
      # Internal render size: 648x1152 upscaled to 1080x1920 with Lanczos at encode.
      # ~2.8x cheaper than native 1080p and still far sharper than the 576x1024 reference.
      DSF: "0.6"
      CALIBRATE: "0"
      BAKE_MAX_PX: "900"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright numpy pillow requests shapely imageio-ffmpeg
          python -m playwright install chromium
          nproc; free -g | head -2; df -h . | tail -1

      - name: assets (geoBoundaries + flagcdn + Wikimedia CC photos + fonts + World Bank)
        run: |
          python render/fetch_assets.py
          python render/prep_geo.py
          python render/bake.py

      - name: audio -> timeline (voice drives every cut)
        if: env.MODE != 'bench' && env.MODE != 'probe'
        run: python render/build_audio.py

      - name: bench
        if: env.MODE == 'bench'
        run: |
          TILE=0 python render/bench.py || echo BENCH_NOSAT_FAILED
          cp -f bench.json results_bench_nosat.json 2>/dev/null || true
          TILE=1 python render/bench.py || echo BENCH_SAT_FAILED
          cp -f bench.json results_bench_sat.json 2>/dev/null || true

      - name: preview (4 frames, full quality)
        if: env.MODE == 'preview'
        run: python render/render_all.py --preview 3.5,17.0,30.0,45.5,57.5

      - name: probe (measure ms/frame on the production page)
        if: env.MODE == 'probe'
        run: python render/render_all.py --probe ${{ env.PROBE_FRAMES }}

      - name: full render
        if: env.MODE == 'full'
        run: python render/render_all.py

      - name: results manifest
        if: always()
        run: |
          { echo "run=${{ github.run_id }} mode=$MODE sha=${{ github.sha }}"; date -u;
            echo "--- seg reports ---"; cat out/seg_*.json 2>/dev/null | tr -d ' \n'; echo;
            echo "--- sizes ---"; du -sh assets out 2>/dev/null || true;
            if [ -d out/preview ]; then echo "--- preview stills ---"; ls -la out/preview; fi
            if [ -f out/render_report.json ]; then echo "--- render report ---"; cat out/render_report.json; fi; } > results.txt
          cat results.txt

      - name: artifact fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ env.MODE }}-${{ github.run_number }}
          path: |
            results.txt
            out/
            bench.json
            audio/timeline.json
          if-no-files-found: warn
          retention-days: 3
